<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schermo aula</title>
<link rel="stylesheet" href="stile.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="config.js"></script><script src="common.js"></script>
</head><body class="schermo">
<h1 id="tit">Registra la tua presenza</h1>
<canvas id="qr" style="display:none"></canvas>
<p id="msg" style="font-size:1.2rem">Caricamento…</p>
<p id="sub" class="muted" style="color:#9fb4c8"></p>
<script>
const token = new URLSearchParams(location.search).get('t');
const base = new URL('index.html', location.href).href;
let ultimo = null, scade = null;

async function tick() {
  if (!token) { $('#msg').textContent = 'Link dello schermo non valido (manca il token).'; return; }
  const { data, error } = await sb.rpc('codice_corrente', { p_token: token });
  if (error || !data) { $('#msg').textContent = 'Connessione assente, riprovo…'; return; }
  if (!data.attiva) {
    $('#qr').style.display = 'none'; ultimo = null;
    $('#msg').textContent = data.motivo === 'token_non_valido' ? 'Schermo non riconosciuto.' : 'Nessuna lezione in corso in questa aula.';
    $('#sub').textContent = ''; return;
  }
  if (data.codice !== ultimo) {
    ultimo = data.codice;
    const w = Math.min(innerHeight * 0.65, innerWidth * 0.85);
    await QRCode.toCanvas($('#qr'), base + '?c=' + data.codice, { width: Math.floor(w), margin: 1 });
  }
  scade = new Date(data.scade);
  $('#qr').style.display = 'block';
  $('#msg').textContent = 'Inquadra il QR con l\'app e connettiti al Wi-Fi dell\'aula';
}
setInterval(tick, 5000); tick();
setInterval(() => { if (scade) { const s = Math.max(0, Math.round((scade - Date.now()) / 1000)); $('#sub').textContent = 'Codice valido ancora ' + s + ' s · si rinnova da solo'; } }, 1000);
// Evita che lo schermo si spenga (dove supportato)
try { navigator.wakeLock && navigator.wakeLock.request('screen'); } catch {}
</script></body></html>
