<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E5A45">
<title>Presenze</title>
<link rel="stylesheet" href="stile.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="config.js?v=2"></script><script src="common.js?v=2"></script>
</head><body><header id="brand"></header><main id="app"><p>Caricamento…</p></main>
<script>
const app = $('#app');
const deviceId = localStorage.getItem('dev') || (() => { const v = crypto.randomUUID(); localStorage.setItem('dev', v); return v; })();
let codiceInAttesa = new URLSearchParams(location.search).get('c');
let esito = '';

avvia(app, async () => {
  const r = await sb.rpc('collega_account');
  if (r.error || !r.data?.ok) {
    app.innerHTML = `<h1>Email non riconosciuta</h1><div class="err">${esc(r.data?.errore || r.error?.message || 'Errore')}.<br>Entra con l'email che hai comunicato all'università.</div><p class="piede"><a href="#" onclick="esci();return false">Usa un'altra email</a></p>`;
    return;
  }
  history.replaceState(null, '', location.pathname);
  if (codiceInAttesa) { await registra(codiceInAttesa); codiceInAttesa = null; }
  home();
}, codiceInAttesa ? "Dopo l'accesso inquadra di nuovo il QR in aula: il codice dura pochi secondi." : '');

function avviso(h) { const e = $('#esito'); if (e) e.innerHTML = h; }

function estraiCodice(t) {
  try { return new URL(t).searchParams.get('c') || t; } catch { return t; }
}

async function registra(codice) {
  let data = null, error = null;
  for (let i = 0; i < 3; i++) {                       // rete lenta: fino a 3 tentativi
    ({ data, error } = await sb.rpc('registra_presenza', { p_codice: codice, p_device: deviceId }));
    if (!error) break;
    if (i < 2) { avviso('<div class="warn">Rete lenta, riprovo…</div>'); await new Promise(r => setTimeout(r, 1500 * (i + 1))); }
  }
  const ora = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  if (error || !data) esito = `<div class="err"><b>Presenza non registrata.</b> La rete è assente o troppo lenta. Inquadra di nuovo il QR; se il problema continua, avvisa il docente.</div>`;
  else if (!data.ok) esito = `<div class="err"><b>Presenza non registrata.</b> ${esc(data.errore)}</div>`;
  else if (data.rete_ok) esito = `<div class="esito-ok"><span class="timbro">Presente</span><div><b>Presenza registrata</b><br><span class="muted">alle ${ora}</span></div></div>`;
  else esito = `<div class="warn"><b>Presenza registrata, da verificare.</b><br>Non risulti collegato al Wi-Fi dell'aula. Se sei in aula, collegati e scansiona di nuovo il QR: la presenza si aggiorna da sola. Altrimenti la controlla il docente.</div>`;
}

async function home() {
  const me = (await sb.from('studenti').select('*').maybeSingle()).data;
  app.innerHTML = `<h1>Ciao ${esc(me.nome)}</h1>
    <p class="muted">${esc(me.cognome)} ${esc(me.nome)} · matricola ${esc(me.matricola)}</p>
    <div id="esito">${esito}</div>
    <section class="card azione"><p>Sei in aula? Collegati al Wi-Fi dell'aula e inquadra il QR sullo schermo.</p>
      <button class="big" id="scan">Scansiona il QR</button><div id="reader"></div></section>
    <h2>Le tue presenze</h2><div id="lista">…</div>
    <h2>Assenze da giustificare</h2><div id="giust">…</div>
    <p class="piede"><a href="#" onclick="esci();return false">Esci</a></p>`;
  esito = '';
  $('#scan').onclick = scansiona;
  elenco(); giustifica(me);
}

let scanner = null;
async function chiudiScanner() {
  if (scanner) { try { await scanner.stop(); } catch {} scanner = null; }
  const r = $('#reader'); if (r) r.innerHTML = '';
  const b = $('#scan'); if (b) b.textContent = 'Scansiona il QR';
}
async function scansiona() {
  if (scanner) return chiudiScanner();
  scanner = new Html5Qrcode('reader');
  $('#scan').textContent = 'Chiudi la fotocamera';
  try {
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 240 }, async testo => {
      const codice = estraiCodice(testo);
      await chiudiScanner();
      await registra(codice); home();
    });
  } catch (e) {
    await chiudiScanner();
    $('#esito').innerHTML = `<div class="err"><b>Fotocamera non disponibile.</b> Consenti l'accesso alla fotocamera nelle impostazioni del browser, oppure inquadra il QR con l'app Fotocamera del telefono.</div>`;
  }
}

async function elenco() {
  const { data, error } = await sb.from('presenze')
    .select('creato_il,rete_ok,anomalia,lezioni(inizio,tipo,corsi(nome),aule(nome))')
    .order('creato_il', { ascending: false }).limit(20);
  if (error) return $('#lista').innerHTML = `<div class="err">${esc(error.message)}</div>`;
  $('#lista').innerHTML = data.length
    ? `<div class="tab-wrap"><table><tr><th>Lezione</th><th>Corso</th><th>Esito</th></tr>` +
      data.map(p => `<tr><td>${fmt(p.lezioni.inizio)}</td><td>${esc(p.lezioni.corsi?.nome)}<br><small>${esc(p.lezioni.aule?.nome)}</small></td>
        <td>${p.anomalia ? '<span class="chip warn">Da verificare</span>' : '<span class="chip ok">Registrata</span>'}</td></tr>`).join('') + '</table></div>'
    : '<p class="muted">Ancora nessuna presenza. Dopo la prima lezione la trovi qui.</p>';
}

async function giustifica(me) {
  const [L, P, G] = await Promise.all([
    sb.from('lezioni').select('id,inizio,corsi(nome)').lt('inizio', new Date().toISOString()).eq('obbligatoria', true).order('inizio', { ascending: false }).limit(40),
    sb.from('presenze').select('lezione_id'),
    sb.from('giustificazioni').select('lezione_id,stato')
  ]);
  const pres = new Set((P.data || []).map(x => x.lezione_id));
  const gm = new Map((G.data || []).map(x => [x.lezione_id, x.stato]));
  const assenti = (L.data || []).filter(l => !pres.has(l.id));
  const inviate = assenti.filter(l => gm.has(l.id));
  const libere = assenti.filter(l => !gm.has(l.id));
  const lab = { in_attesa: '<span class="chip neu">In attesa</span>', accettata: '<span class="chip ok">Accettata</span>', rifiutata: '<span class="chip no">Rifiutata</span>' };
  let h = '';
  if (inviate.length) h += '<div class="tab-wrap"><table><tr><th>Lezione</th><th>Stato</th></tr>' + inviate.map(l => `<tr><td>${fmt(l.inizio)} · ${esc(l.corsi?.nome)}</td><td>${lab[gm.get(l.id)]}</td></tr>`).join('') + '</table></div>';
  if (libere.length) h += `<div class="card"><p class="muted" style="margin-top:0">Hai saltato una lezione obbligatoria? Scegli quale e spiega il motivo.</p>
    <div class="riga"><select id="gl">${libere.map(l => `<option value="${l.id}">${fmt(l.inizio)} · ${esc(l.corsi?.nome)}</option>`).join('')}</select></div>
    <textarea id="gm" rows="3" placeholder="Motivo dell'assenza"></textarea><div class="riga"><button id="gs">Invia giustificazione</button></div></div>`;
  if (!h) h = '<p class="muted">Nessuna assenza da giustificare.</p>';
  $('#giust').innerHTML = h;
  if (libere.length) $('#gs').onclick = async () => {
    const motivo = $('#gm').value.trim();
    if (!motivo) return alert('Scrivi il motivo dell\'assenza.');
    const { error } = await sb.from('giustificazioni').insert({ lezione_id: $('#gl').value, studente_id: me.id, motivo });
    if (error) alert(error.message); else giustifica(me);
  };
}
</script></body></html>
